services:
  - type: web
    name: ap-workspace
    runtime: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    disk:
      name: ap-workspace-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://app.anjanpatel.ca
      - key: DB_PATH
        value: /data/data.sqlite
      - key: RESET_EMAIL_FROM
        value: AP Workspace <noreply@anjanpatel.ca>
      - key: RESEND_API_KEY
        sync: false
      # Creates your first login automatically on deploy — no shell/terminal
      # needed. Pick any email and password here; sign in with them once live.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_FIRST_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_LAST_NAME
        sync: false
      # Only needed if migrating existing accounts from Supabase. Leave
      # blank otherwise — nothing reads this at startup, only `npm run
      # migrate`, which is optional and can be skipped entirely.
      - key: SUPABASE_DB_URL
        sync: false
