name = "ap-workspace-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Fill in database_id after running:
#   wrangler d1 create ap-workspace
[[d1_databases]]
binding = "DB"
database_name = "ap-workspace"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Serves this Worker at api.anjanpatel.ca once that DNS record exists in the
# same Cloudflare account (see worker/README.md).
routes = [
  { pattern = "api.anjanpatel.ca", custom_domain = true }
]
