<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — anjanpatel.ca</title>
<meta name="description" content="Access the engineering workspace at app.anjanpatel.ca">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --canvas:   #0b0f19;
  --surface:  #171e2e;
  --elevated: #1b2435;
  --spotlight:#1e2638;
  --border:   #2d3748;
  --text:     #f8fafc;
  --muted:    #94a3b8;
  --dim:      #64748b;
  --emerald:  #00d27a;
  --emerald-t:#040811;
  --indigo:   #6366f1;
  --error:    #ef4444;
  --warn:     #f59e0b;
  --ease:     150ms ease-in-out;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  background:var(--canvas);
  color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}
::selection { background:var(--indigo); color:var(--text); }

/* ── Spotlight ── */
.spotlight {
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 62% 55% at 50% 46%,var(--spotlight) 0%,#161d2e 34%,#10151f 58%,var(--canvas) 82%);
  opacity:0;transform:scale(0.94);
  animation:spotBloom 1600ms cubic-bezier(.22,1,.36,1) 120ms forwards;
  will-change:transform,opacity;
}
.spotlight::after {
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 34% 30% at 50% 44%,rgba(99,102,241,.06) 0%,transparent 70%);
}
@keyframes spotBloom { to { opacity:1;transform:scale(1); } }

/* ── Stage ── */
.stage {
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 20px 96px;
}

/* ── Reveal animation ── */
.reveal {
  opacity:0;transform:translateY(18px);clip-path:inset(0 0 100% 0);
  animation:maskReveal 900ms cubic-bezier(.22,1,.36,1) forwards;
  will-change:transform,opacity,clip-path;
}
@keyframes maskReveal {
  60% { clip-path:inset(0 0 0% 0); }
  100% { opacity:1;transform:translateY(0);clip-path:inset(0 0 0% 0); }
}
.d1{animation-delay:220ms}.d2{animation-delay:340ms}.d3{animation-delay:460ms}
.d4{animation-delay:560ms}.d5{animation-delay:660ms}.d6{animation-delay:760ms}

/* ── AP mark ── */
.ap-mark {
  display:flex;align-items:center;gap:10px;
  margin-bottom:36px;user-select:none;
}
.ap-hex {
  opacity:0;transform:scale(0.6) rotate(-15deg);
  animation:hexIn 1000ms cubic-bezier(.22,1,.36,1) 200ms forwards;
  will-change:transform,opacity;
}
@keyframes hexIn { to { opacity:1;transform:scale(1) rotate(0deg); } }
.ap-wordmark {
  display:flex;flex-direction:column;
  opacity:0;animation:fadeIn 600ms ease 700ms forwards;
}
@keyframes fadeIn { to { opacity:1; } }
.ap-wordmark-name { font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--text);line-height:1.2; }
.ap-wordmark-sub  { font-size:10px;color:var(--dim);letter-spacing:.08em;font-family:'JetBrains Mono',monospace; }

/* ── Card ── */
.card {
  width:100%;max-width:420px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:32px 32px 28px;
}

/* ── Views ── */
.view { display:none; }
.view.active { display:block; animation:viewIn 260ms cubic-bezier(.22,1,.36,1) both; }
@keyframes viewIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* ── Tabs ── */
.tabs {
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  background:rgba(11,15,25,.65);border:1px solid var(--border);
  border-radius:7px;padding:3px;margin-bottom:24px;
}
.tab-indicator {
  position:absolute;top:3px;left:3px;
  width:calc(50% - 3px);height:calc(100% - 6px);
  background:var(--elevated);border:1px solid var(--border);
  border-radius:5px;
  transition:transform 220ms cubic-bezier(.22,1,.36,1);
  will-change:transform;
}
.tab {
  position:relative;z-index:1;appearance:none;background:none;border:none;
  font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
  color:var(--muted);padding:8px 0;cursor:pointer;border-radius:5px;
  transition:color var(--ease);
}
.tab:hover { color:var(--text); }
.tab[aria-selected="true"] { color:var(--text); }
.tab:focus-visible { outline:2px solid var(--indigo);outline-offset:2px; }

/* ── Fields ── */
.field { margin-bottom:16px; }
.field-row { display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px; }
.field label { font-size:12px;font-weight:500;color:var(--text);letter-spacing:.02em; }
.inline-btn {
  font-size:11px;color:var(--dim);text-decoration:none;
  background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;padding:0;
  transition:color var(--ease);
}
.inline-btn:hover { color:var(--text); }
.inline-btn:focus-visible { outline:2px solid var(--indigo);outline-offset:2px;border-radius:2px; }

.field input {
  width:100%;height:40px;
  background:rgba(11,15,25,.65);
  border:1px solid var(--border);border-radius:6px;
  padding:0 12px;
  font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);
  caret-color:var(--indigo);
  transition:border-color var(--ease),box-shadow var(--ease);
}
.field input::placeholder { color:#3d4e63;font-family:'Inter',sans-serif;font-size:13px; }
.field input:hover { border-color:#3a4658; }
.field input:focus { outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(99,102,241,.15); }
.field input[aria-invalid="true"] { border-color:var(--error); }
.field input[aria-invalid="true"]:focus { box-shadow:0 0 0 3px rgba(239,68,68,.12); }

.err-msg {
  min-height:16px;margin-top:4px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--error);
  opacity:0;transform:translateY(-2px);
  transition:opacity var(--ease),transform var(--ease);
}
.err-msg.visible { opacity:1;transform:translateY(0); }

.form-note {
  min-height:16px;margin:4px 0 8px;
  font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.5;
  color:var(--error);opacity:0;transform:translateY(-2px);
  transition:opacity var(--ease),transform var(--ease);
}
.form-note.visible { opacity:1;transform:translateY(0); }
.form-note.ok { color:var(--emerald); }
.form-note.info { color:var(--muted); }

.shake { animation:shake 320ms cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }

/* ── CTA button ── */
.cta {
  width:100%;height:42px;margin-top:4px;
  appearance:none;border:none;border-radius:6px;
  background:var(--emerald);color:var(--emerald-t);
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;letter-spacing:.01em;
  cursor:pointer;
  transition:background-color var(--ease),transform var(--ease),opacity var(--ease);
}
.cta:hover:not(:disabled) { background:#17e58c;transform:translateY(-1px); }
.cta:active:not(:disabled) { transform:translateY(0); }
.cta:disabled { cursor:default;opacity:.7; }
.cta:focus-visible { outline:2px solid var(--indigo);outline-offset:3px; }
.cta-label { display:inline-block;transition:opacity var(--ease); }
.cta-label.fading { opacity:0; }

/* ── Divider ── */
.divider {
  display:flex;align-items:center;gap:12px;margin:20px 0;
  color:var(--dim);font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.14em;
}
.divider::before,.divider::after { content:'';flex:1;height:1px;background:var(--border); }

/* ── OAuth buttons ── */
.oauth { display:flex;flex-direction:column;gap:10px; }
.oauth-btn {
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:40px;appearance:none;
  background:rgba(11,15,25,.45);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;
  transition:border-color var(--ease),background-color var(--ease),transform var(--ease);
}
.oauth-btn:hover:not(:disabled) {
  border-color:#46536a;background:rgba(30,38,56,.55);transform:translateY(-1px);
}
.oauth-btn:disabled { opacity:.5;cursor:default; }
.oauth-btn:focus-visible { outline:2px solid var(--indigo);outline-offset:3px; }
.oauth-btn svg { flex-shrink:0; }

/* ── Back / sub-heading ── */
.back-row { margin-bottom:20px; }
.view-heading { font-size:16px;font-weight:600;margin-bottom:4px; }
.view-sub { font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px; }

/* ── Footer ── */
.footer {
  position:relative;z-index:1;padding:16px 20px 20px;
  text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);
  opacity:0;animation:fadeIn 900ms ease 900ms forwards;
}
.footer a { color:var(--dim);text-decoration:none;transition:color var(--ease); }
.footer a:hover { color:var(--muted); }
.footer .sep { margin:0 8px;opacity:.4; }

@media (max-width:480px) {
  .card { padding:24px 20px 22px;border-radius:8px; }
  .stage { padding:32px 16px 80px; }
  .ap-mark { margin-bottom:28px; }
}
@media (prefers-reduced-motion:reduce) {
  .reveal,.spotlight,.footer,.ap-hex,.ap-wordmark { animation-duration:1ms;animation-delay:0ms; }
  * { transition-duration:1ms !important; }
}
</style>
</head>
<body>

<main class="stage">

<script>
(function(){
  var c=document.getElementById('priv-link');
  var e='info'+'@'+'anjanpatel'+'.'+'ca';
  c.href='mailto:'+e;c.textContent='Contact';
})();

var SUPABASE_URL='https://uejlrooupfcrqimffgsn.supabase.co';
var SUPABASE_ANON='sb_publishable_lNVg4KjZcmMqPgbOBJhTgA_dQM_yuO6';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

var mode='signin';
var busy=false;
var EMAIL_RE=/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;

var COPY={
  signin:{idle:'Access Workspace',working:'Signing In…',done:'Access Granted'},
  create:{idle:'Create Account',working:'Creating…',done:'Account Created'}
};

/* helpers */
function $(id){return document.getElementById(id)}
function showView(name){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});
  $('view-'+name).classList.add('active');
}
function setNote(id,msg,type){
  var el=$(id);el.textContent=msg;
  el.className='form-note'+(msg?' visible':'');
  if(type==='ok')el.classList.add('ok');
  if(type==='info')el.classList.add('info');
}
function setErr(inputId,errId,msg){
  var inp=$(inputId),err=$(errId);
  if(msg){
    err.textContent=msg;err.classList.add('visible');
    inp.setAttribute('aria-invalid','true');
    inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');
  } else {
    err.textContent='';err.classList.remove('visible');
    inp.removeAttribute('aria-invalid');
  }
}
function swapLabel(labelId,text){
  var el=$(labelId);el.classList.add('fading');
  setTimeout(function(){el.textContent=text;el.classList.remove('fading')},150);
}

/* Tab switching */
$('tab-signin').addEventListener('click',function(){setMode('signin')});
$('tab-create').addEventListener('click',function(){setMode('create')});
function setMode(next){
  if(busy||next===mode)return;
  mode=next;
  $('tab-signin').setAttribute('aria-selected',String(next==='signin'));
  $('tab-create').setAttribute('aria-selected',String(next==='create'));
  $('tabIndicator').style.transform=next==='create'?'translateX(100%)':'translateX(0)';
  swapLabel('cta-label',COPY[mode].idle);
  $('password').setAttribute('autocomplete',next==='signin'?'current-password':'new-password');
  setErr('email','email-error','');setErr('password','password-error','');setNote('auth-note','');
}

/* Clear errors on input */
$('email').addEventListener('input',function(){setErr('email','email-error','');setNote('auth-note','')});
$('password').addEventListener('input',function(){setErr('password','password-error','')});

/* Auth submit */
$('auth-form').addEventListener('submit',async function(e){
  e.preventDefault();if(busy)return;
  var em=$('email').value.trim();
  var pw=$('password').value;
  var ok=true;
  if(!em){setErr('email','email-error','Email is required');ok=false}
  else if(!EMAIL_RE.test(em)){setErr('email','email-error','Enter a valid email');ok=false}
  if(!pw){setErr('password','password-error','Password is required');ok=false}
  else if(pw.length<6){setErr('password','password-error','Minimum 6 characters');ok=false}
  if(!ok)return;
  busy=true;$('submit-btn').disabled=true;setNote('auth-note','');
  swapLabel('cta-label',COPY[mode].working);
  var r=mode==='signin'
    ?await sb.auth.signInWithPassword({email:em,password:pw})
    :await sb.auth.signUp({email:em,password:pw});
  if(r.error){
    swapLabel('cta-label',COPY[mode].idle);
    setNote('auth-note',r.error.message);
    $('submit-btn').disabled=false;busy=false;return;
  }
  if(mode==='create'&&r.data.user&&!r.data.session){
    swapLabel('cta-label',COPY[mode].idle);
    setNote('auth-note','Check your email to confirm your account.','info');
    $('submit-btn').disabled=false;busy=false;return;
  }
  swapLabel('cta-label',COPY[mode].done);
  setTimeout(function(){window.location.href='/dashboard.html'},700);
});

/* Forgot password */
$('forgot-link').addEventListener('click',function(){setNote('forgot-note','');showView('forgot')});
$('forgot-back').addEventListener('click',function(){showView('auth')});
$('forgot-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var em=$('forgot-email').value.trim();
  setErr('forgot-email','forgot-err','');setNote('forgot-note','');
  if(!em){setErr('forgot-email','forgot-err','Email is required');return}
  if(!EMAIL_RE.test(em)){setErr('forgot-email','forgot-err','Enter a valid email');return}
  $('forgot-btn').disabled=true;swapLabel('forgot-label','Sending…');
  var r=await sb.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+'/?reset=1'});
  swapLabel('forgot-label','Send Reset Link');$('forgot-btn').disabled=false;
  if(r.error){setNote('forgot-note',r.error.message);return}
  setNote('forgot-note','If an account exists, a reset link is on its way.','ok');
});

/* Reset password (Supabase sets #access_token in hash) */
$('reset-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var pw=$('reset-pass').value;
  setErr('reset-pass','reset-err','');setNote('reset-note','');
  if(!pw){setErr('reset-pass','reset-err','Password is required');return}
  if(pw.length<8){setErr('reset-pass','reset-err','Minimum 8 characters');return}
  $('reset-btn').disabled=true;swapLabel('reset-label','Setting…');
  var r=await sb.auth.updateUser({password:pw});
  swapLabel('reset-label','Set New Password');$('reset-btn').disabled=false;
  if(r.error){setNote('reset-note',r.error.message);return}
  setNote('reset-note','Password updated — signing you in…','ok');
  setTimeout(function(){window.location.href='/dashboard.html'},1200);
});

/* OAuth */
function oauthLogin(provider){
  sb.auth.signInWithOAuth({provider:provider,options:{redirectTo:window.location.origin+'/dashboard.html'}});
}
$('google-btn').addEventListener('click',function(){oauthLogin('google')});
$('microsoft-btn').addEventListener('click',function(){oauthLogin('azure')});
$('github-btn').addEventListener('click',function(){oauthLogin('github')});

/* Boot */
(async function boot(){
  /* Check if Supabase returned from password reset (hash contains access_token + type=recovery) */
  var hash=window.location.hash;
  if(hash.includes('type=recovery')){
    var params=new URLSearchParams(hash.replace(/^#/,''));
    var token=params.get('access_token');
    if(token){
      await sb.auth.setSession({access_token:token,refresh_token:params.get('refresh_token')||''});
      showView('reset');
      window.history.replaceState({},'',window.location.pathname);
      return;
    }
  }
  /* Already signed in → dashboard */
  var r=await sb.auth.getSession();
  if(r.data&&r.data.session){window.location.href='/dashboard.html';return}
  showView('auth');
})();

/* Spotlight parallax */
(function(){
  var rm=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(rm)return;
  var spot=document.getElementById('spotlight');
  var tx=0,ty=0,cx=0,cy=0;
  window.addEventListener('mousemove',function(e){
    tx=(e.clientX/window.innerWidth-.5)*22;
    ty=(e.clientY/window.innerHeight-.5)*14;
  });
  (function drift(){
    cx+=(tx-cx)*.045;cy+=(ty-cy)*.045;
    spot.style.transform='translate3d('+cx+'px,'+cy+'px,0)';
    requestAnimationFrame(drift);
  })();
})();
</script>
