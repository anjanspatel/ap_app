<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('ap-theme')||'dark';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}}());</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — AP Workspace</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f19">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --canvas:#0b0f19;
  --surface:#171e2e;
  --border:#2d3748;
  --text:#f8fafc;
  --muted:#94a3b8;
  --dim:#64748b;
  --indigo:#6366f1;
}
[data-theme="light"]{
  --canvas:#f0f4f8;
  --surface:#ffffff;
  --border:#e2e8f0;
  --text:#0f172a;
  --muted:#475569;
  --dim:#94a3b8;
  --indigo:#4f46e5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--canvas);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.code{font-size:clamp(5rem,18vw,9rem);font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--text);opacity:.07;margin-bottom:-.4rem;user-select:none;font-family:'Inter',sans-serif}
.code span{color:var(--indigo);opacity:1}
.title{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:700;color:var(--text);margin-bottom:.4rem;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin-bottom:2rem;font-family:'JetBrains Mono',monospace}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--indigo);color:#fff;border:none;border-radius:6px;padding:.6rem 1.3rem;font:600 12px 'Inter',system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:opacity .15s;letter-spacing:.01em}
.btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="page">
  <div class="code">4<span>0</span>4</div>
  <h1 class="title">Page not found</h1>
  <p class="sub">This page doesn't exist or you don't have access.</p>
  <a class="btn" href="/">Go to Home</a>
</div>
</body>
</html>
