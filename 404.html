<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('pd-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}}());</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Anjan Patel Engineering</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1D2D">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1D2D;--orange:#F28C18;--bg:#EFF3FA;--surface:#fff;--text:#0B1D2D;--muted:#5E728A;--line:#D3DCE9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04080F;--surface:#091522;--text:#EDF2F8;--muted:#7A96B0;--line:#122030}}
:root[data-theme="dark"]{--bg:#04080F;--surface:#091522;--text:#EDF2F8;--muted:#7A96B0;--line:#122030}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.code{font-size:clamp(5rem,18vw,9rem);font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--text);opacity:.08;margin-bottom:-.5rem;user-select:none}
.code span{color:var(--orange);opacity:1}
.title{font-size:clamp(1.2rem,3vw,1.6rem);font-weight:700;color:var(--text);margin-bottom:.5rem}
.sub{font-size:14px;color:var(--muted);margin-bottom:2rem}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;border:none;border-radius:10px;padding:.65rem 1.4rem;font:700 13px 'IBM Plex Sans',Arial,sans-serif;text-decoration:none;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.9}
</style>
</head>
<body>
<div class="page">
  <div class="code">4<span>0</span>4</div>
  <h1 class="title">Page not found</h1>
  <p class="sub">This page doesn't exist or you don't have access.</p>
  <a class="btn" href="/dashboard.html">Go to Dashboard</a>
</div>
</body>
</html>
