<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://plausible.io; img-src 'self' data: https:; base-uri 'self'">
<link rel="preload" href="/tokens.css" as="style">
<script>(function(){try{var t=localStorage.getItem('ap-theme')||'dark';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}}());</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B111A">
<title>404 — AP Workspace</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background:var(--bg-app);color:var(--text-primary);font-family:var(--font-ui);transition:background .2s,color .2s}
::selection{background:var(--precision-cyan);color:#fff}
.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(2rem + env(safe-area-inset-top)) 2rem calc(2rem + env(safe-area-inset-bottom));gap:0}
.code{
  font-size:clamp(5rem,18vw,9rem);font-weight:900;letter-spacing:-.05em;line-height:1;
  color:var(--text-primary);opacity:.07;margin-bottom:-.4rem;user-select:none;
}
.code span{color:var(--precision-cyan);opacity:1}
.eyebrow{font:700 10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--precision-cyan);margin-bottom:12px}
.title{font-size:clamp(1.1rem,3vw,1.4rem);font-weight:700;color:var(--text-primary);margin-bottom:.5rem;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--text-secondary);margin-bottom:2rem;font-family:var(--font-mono);letter-spacing:.03em}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--precision-cyan);color:#0B111A;
  border:none;border-radius:var(--radius-md);
  padding:.6rem 1.4rem;font:600 12px var(--font-ui);
  text-decoration:none;cursor:pointer;
  transition:filter var(--motion-fast),transform var(--motion-fast);
  letter-spacing:.02em;min-height:44px;min-width:44px;
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{
  background:transparent;color:var(--text-secondary);
  border:1px solid var(--border-color);
}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--text-muted)}
</style>
</head>
<body id="main-content">

<main class="page">
  <div class="code" aria-hidden="true">4<span>0</span>4</div>
  <p class="eyebrow">Not Found</p>
  <h1 class="title">Page not found</h1>
  <p class="sub">This page doesn't exist or you don't have access.</p>
  <div class="actions">
    <a class="btn" href="/">Go to AP Workspace</a>
    <a class="btn btn-ghost" href="/dashboard.html">Dashboard</a>
  </div>
</main>

<script src="/global-features.js"></script>
<script defer data-domain="app.anjanpatel.ca" src="https://plausible.io/js/script.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){
      var sw=reg.installing;
      sw.addEventListener('statechange',function(){
        if(sw.state==='installed'&&navigator.serviceWorker.controller){
          var b=document.getElementById('sw-update-banner');if(b)b.style.display='flex';
        }
      });
    });
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){window.location.reload()});
}
</script>
<div id="sw-update-banner" aria-live="polite" style="display:none;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--bg-elevated);color:var(--text-primary);border:1px solid rgba(25,211,230,.45);border-radius:8px;padding:11px 16px;font-size:12.5px;font-family:'Inter',Arial,sans-serif;gap:12px;align-items:center;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);white-space:nowrap">
  <span>Update available</span>
  <button onclick="window.location.reload()" style="background:#19D3E6;color:#fff;border:none;border-radius:6px;padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px">Refresh</button>
</div>
</body>
</html>
