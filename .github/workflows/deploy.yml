name: Deploy to GitHub Pages

# Manual trigger ONLY. app.anjanpatel.ca's DNS now points at Cloudflare
# Pages (see deploy-cloudflare-pages.yml, the actual live-site deploy
# path) — this used to redeploy GitHub Pages on every push to main,
# which meant every push updated a site nothing points to anymore.
# GitHub Pages itself is untouched and still serving whatever it last
# deployed, kept intentionally as a rollback target: if Cloudflare
# Pages ever needs to be rolled back from, DNS can point back to a
# known-good GitHub Pages snapshot without needing this workflow to
# have kept running in the meantime. Run it manually (Actions tab ->
# this workflow -> Run workflow) if that snapshot ever needs updating.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p dist
          rsync -a --exclude='.github' --exclude='.git' --exclude='dist' \
            --exclude='.dev' --exclude='test' --exclude='package.json' \
            ./ dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
