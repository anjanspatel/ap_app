name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p dist
          rsync -a --exclude='.github' --exclude='.git' --exclude='dist' \
            --exclude='.dev' --exclude='test' --exclude='package.json' \
            ./ dist/

      - name: Stamp last-updated date
        run: |
          STAMP=$(date -u +"%B %-d, %Y")
          echo "Stamp value: $STAMP"
          MATCHES=$(grep -rl '__LAST_UPDATED__' dist/ || true)
          if [ -z "$MATCHES" ]; then
            echo "No files contain __LAST_UPDATED__ — nothing to stamp. This is unexpected if the placeholder should still be in the source."
          else
            echo "Files to stamp:"
            echo "$MATCHES"
            echo "$MATCHES" | xargs sed -i "s/__LAST_UPDATED__/$STAMP/g"
            echo "Done. Remaining unstamped occurrences (should be none):"
            grep -rl '__LAST_UPDATED__' dist/ || echo "(none)"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
