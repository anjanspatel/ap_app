name: Deploy preview to Cloudflare Pages

# Runs alongside the existing GitHub Pages deploy — it does not replace it
# and does not touch app.anjanpatel.ca. It publishes the same static site
# to a *.pages.dev preview URL so you can confirm the real security
# headers (see /_headers) work before pointing the live domain at
# Cloudflare Pages. See worker/README.md, "Move static hosting to
# Cloudflare Pages", for the full cutover.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — dash.cloudflare.com → My Profile → API Tokens
#                            → Create Token → "Edit Cloudflare Workers"
#                            template covers Pages too.
#   CLOUDFLARE_ACCOUNT_ID  — dash.cloudflare.com → right sidebar of any
#                            account page.
# Manual trigger ONLY (Actions tab → this workflow → Run workflow) — it
# does NOT run on every push. It used to run automatically on every push
# to main, which meant a failed run (and a failure email) on every single
# commit for as long as the two secrets below aren't configured, since
# there's no way for a workflow to skip itself before secrets are checked
# without still showing as a run. Since this preview is opt-in and most
# pushes have nothing to do with it, opt-in triggering is the actual fix,
# not just a quieter failure.
#
# Uses cloudflare/wrangler-action (not cloudflare/pages-action, which
# Cloudflare has removed from the Marketplace — using it now fails
# immediately with "Unable to resolve action, not found"). wrangler-action
# is Cloudflare's current, maintained path for both Workers and Pages
# deploys, driving the same `wrangler pages deploy` a human would run
# locally with the CLI.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets aren't set. Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow. See this file's header comment for where to get each value."
            exit 1
          fi

      - name: Stage site
        run: |
          mkdir -p dist
          rsync -a --exclude='.github' --exclude='.git' --exclude='dist' \
            --exclude='.dev' --exclude='test' --exclude='package.json' \
            ./ dist/

      # The Pages project itself isn't created by `pages deploy` — it has to
      # exist first. `project create` errors if it's already there, which is
      # exactly what happens on every run after the first, so that failure
      # is expected and ignored rather than treated as this step failing.
      - name: Ensure Cloudflare Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ap-workspace --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ap-workspace
